# Code-only packaging config -- NOT run as part of this change (no installer/dmg build without
# explicit approval, per instructions). `dir` target on every platform deliberately: this produces
# only an unpacked app folder (win-unpacked/, mac/Nia Core Agent.app) for the *existing* NSIS installer
# (apps/agent/packaging/windows) and macOS install.sh (apps/agent/packaging/macos) to stage directly
# -- electron-builder's own installer/dmg/auto-update machinery is out of scope; those two scripts
# remain the one and only installer per OS.
appId: com.nia.agent.desktop
productName: Nia Core Agent
directories:
  output: dist-electron
files:
  - dist/**/*
  - assets/**/*
  - package.json
asar: true
afterPack: scripts/afterPack.mjs

win:
  target: dir
  icon: assets/app-icon.ico
  # Cross-built from Linux CI with no Windows signing cert configured here --
  # electron-builder's default post-pack step (rcedit resource edit + a
  # signtool invocation) shells out to the winCodeSign package, which in turn
  # requires wine on a Linux host even when there's nothing to actually sign.
  # The real .exe gets signed later, explicitly, by
  # apps/agent/packaging/windows/build-installer.mjs (same one-signing-place
  # pattern as the mac bundle). Skip it here so Linux cross-builds don't need
  # wine installed at all.
  signAndEditExecutable: false

mac:
  target: dir
  icon: assets/app-icon.icns
  category: public.app-category.utilities
  # Signing itself happens later, explicitly, in packaging/macos/build-bundle.mjs
  # (via packaging/macos/sign.mjs) -- NOT here, so it stays in one place
  # alongside the SEA binary's own signing. hardenedRuntime/entitlements
  # must still be true/set here though: they're baked into the unpacked
  # app's Info.plist/structure at `electron-builder package` time, not
  # something a later `codesign` pass can retroactively add.
  hardenedRuntime: true
  entitlements: ../agent/packaging/macos/entitlements.plist
  entitlementsInherit: ../agent/packaging/macos/entitlements.plist

linux:
  target: dir
  icon: assets/app-icon.png
  category: Utility
