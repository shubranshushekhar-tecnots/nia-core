name: agent-windows-smoke

# Lean, fast smoke test for the Windows installer + Electron desktop
# shell, distinct from windows-installer.yml's much heavier checks A-I
# (SQL Server-backed functional tests of pairing/sync). This one never
# touches SQL Server -- it only exercises install/service/Electron-shell
# plumbing: silent install, service health, the local API, Start Menu
# shortcut targets, Electron relaunch + single-instance behavior, the
# upgrade-while-running path, and silent uninstall. Everything (including
# the Electron app itself) is built on the Windows runner directly, since
# electron-builder's Windows output isn't reliably cross-built.

on:
  workflow_dispatch:
  push:
    branches:
      - ci/agent-windows-smoke

jobs:
  smoke:
    runs-on: windows-latest
    # 15 min covered checks 1-7/9 alone; CHECK 8 (auto-update) adds a second
    # @nia/agent build + SEA + NSIS rebuild plus polling for a service
    # restart -- budgeted ~5 extra minutes per the Phase 6 plan.
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    # Signing here is opportunistic, not gated (this is a dev/smoke build,
    # never `build-release.mjs --release`): if these secrets exist in the
    # repo, build-sea.mjs/build-installer.mjs sign the exe "for free" as an
    # extra confidence check (costs seconds); if any are unset (the common
    # case for forks/local reruns), they resolve to empty strings and
    # packaging/windows/sign.mjs's existing no-op path kicks in exactly as
    # it does for any other unsigned dev build -- see that file for what
    # each variable does and which pair (Azure Trusted Signing vs. .pfx)
    # takes precedence.
    env:
      AZURE_TRUSTED_SIGNING_ENDPOINT: ${{ secrets.AZURE_TRUSTED_SIGNING_ENDPOINT }}
      AZURE_TRUSTED_SIGNING_ACCOUNT: ${{ secrets.AZURE_TRUSTED_SIGNING_ACCOUNT }}
      AZURE_TRUSTED_SIGNING_CERT_PROFILE: ${{ secrets.AZURE_TRUSTED_SIGNING_CERT_PROFILE }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
      WINDOWS_CERT_PFX_BASE64: ${{ secrets.WINDOWS_CERT_PFX_BASE64 }}
      WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # makensis (NSIS) for the installer; unzip for build-sea.mjs's
      # Node.js download step (not present on windows-latest by default).
      # Chocolatey's nsis package installs makensis.exe to "C:\Program
      # Files (x86)\NSIS" and adds it to the *machine* PATH registry value
      # -- it does NOT generate a ShimGen shim the way unzip does (compare
      # this step's log: no "ShimGen ... makensis.exe" line). The GitHub
      # Actions Windows runner snapshots PATH once at job start and never
      # re-reads the registry, so later steps' child processes never see
      # that machine-PATH update on their own. Append the install dir to
      # $GITHUB_PATH explicitly so subsequent steps (build-installer.mjs)
      # can actually find makensis on PATH.
      - name: Install makensis + unzip
        run: |
          choco install -y nsis unzip --no-progress
          echo "C:\Program Files (x86)\NSIS" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Speeds up electron-builder's first run after a cache miss only --
      # without this, every run re-downloads the pinned Electron build.
      - name: Cache Electron / electron-builder downloads
        uses: actions/cache@v4
        with:
          path: |
            ~\AppData\Local\electron\Cache
            ~\AppData\Local\electron-builder\Cache
          key: electron-windows-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Build @nia/agent (and its workspace deps)
        run: pnpm --filter @nia/agent... run build

      # Windows dir build, on the Windows runner -- produces
      # apps/agent-desktop/dist-electron/win-unpacked/Nia Agent.exe.
      - name: Build the Electron desktop shell
        run: pnpm --filter @nia/agent-desktop run package

      - name: Build the Windows SEA executable
        run: node apps/agent/packaging/windows/build-sea.mjs

      # No --no-desktop: must ship the Electron shell this smoke test
      # exercises, not the service-only fallback build.
      - name: Build the NSIS installer
        run: node apps/agent/packaging/windows/build-installer.mjs

      - name: Run installer + Electron smoke checks
        run: |
          $setup = Get-ChildItem -Path apps/agent/packaging/windows/dist -Filter "NiaCoreAgent-Setup-*.exe" | Select-Object -First 1
          if (-not $setup) { throw "no NiaCoreAgent-Setup-*.exe found under apps/agent/packaging/windows/dist" }
          Write-Host "setup exe: $($setup.FullName)"
          & ./apps/agent/packaging/windows/ci/run-smoke-checks.ps1 -SetupExePath $setup.FullName

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: agent-windows-smoke-logs
          path: ci-artifacts/**
          if-no-files-found: warn
          retention-days: 14
