# Public front door for docker-compose.prod.yml's niacore-proxy service
# (docs/plans/web-container.md). This is the ONLY service with a published
# port — everything routes to niacore-web:3000, which owns its own
# same-origin proxy to niacore-api (next.config.mjs's /api/backend/:path*
# rewrite). This file deliberately has no /api/ routing of its own: infra
# may replace this whole service with its own reverse proxy as long as it
# (1) forwards everything to niacore-web:3000, (2) passes Host,
# X-Forwarded-For, and X-Forwarded-Proto so Better Auth's secure-cookie
# and CORS-origin logic sees the real public scheme/host, and (3) doesn't
# buffer or time out long-lived SSE responses (chat/run streams) — see the
# proxy_buffering/proxy_read_timeout settings below, chosen to match
# apps/web's own proxyTimeout (next.config.mjs) and apps/api's
# RUN_SSE_MAX_DURATION_MS (env.ts).

worker_processes auto;

events {
  worker_connections 1024;
}

http {
  sendfile on;
  keepalive_timeout 65;

  # Docker's embedded DNS resolves service names (niacore-web) dynamically —
  # a hardcoded `upstream` block (the previous approach) resolves the name
  # ONCE at nginx startup and caches it for the worker's lifetime, so a
  # restarted/recreated niacore-web container (new container IP) causes 502s
  # until nginx itself is reloaded. Using a `resolver` + a variable in
  # `proxy_pass` instead makes nginx re-resolve on each request (bounded by
  # `valid=10s`), so a recreated container is picked up automatically.
  resolver 127.0.0.11 valid=10s ipv6=off;

  # A load balancer in front of this proxy terminates TLS and forwards its
  # own X-Forwarded-Proto; a direct client hitting this proxy has none. Fall
  # back to $scheme (this proxy's own listener, http) only when the header
  # is absent, so niacore-web sees "https" when it should.
  map $http_x_forwarded_proto $fwd_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
  }

  server {
    listen 80;

    # Matches apps/api's CSV/Excel upload limit (apps/api has no such
    # feature/limit configured as of this writing) plus headroom.
    client_max_body_size 50m;

    location / {
      set $web http://niacore-web:3000;
      proxy_pass $web;
      proxy_http_version 1.1;

      # $http_host (not $host): $host silently drops the port from the
      # client's original Host header even when one was present. If this
      # proxy is ever reached on a non-default port (e.g. this repo's own
      # boot test, PROXY_PORT=8080), dropping the port here desyncs the
      # forwarded Host from the browser's Origin header (which does include
      # the port) — Next.js's Server Actions same-origin check then aborts
      # every action (login/signup included) with "Invalid Server Actions
      # request". $http_host forwards the client's Host header byte-for-byte
      # instead, so it always matches Origin.
      proxy_set_header Host $http_host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $fwd_proto;

      # SSE (chat/run streams, proxied by niacore-web itself) must not be
      # buffered here, or events sit in this layer's buffer instead of
      # reaching the client incrementally.
      proxy_buffering off;
      proxy_cache off;

      # Matches apps/web's own rewrite proxyTimeout (30min, covers
      # RUN_SSE_MAX_DURATION_MS) — this layer must not cut a long-lived
      # stream off before that one would.
      proxy_read_timeout 1800s;
      proxy_send_timeout 1800s;
    }

    # Agent-canvas integration, Slice 1 ("Link") — the desktop agent's own
    # traffic (pairing + check-in), never reached by a browser. Routed
    # directly here rather than through niacore-web/niacore-api, since the
    # agent authenticates with its own key, not a Better Auth session.
    # services/agent-bridge/src/app.ts serves its public routes AT
    # /agent-api/pair and /agent-api/check-in (not bare /pair, /check-in),
    # so this location passes the path through unchanged — no rewrite. This
    # keeps the path identical in development (the CLI calls agent-bridge
    # directly, e.g. http://localhost:4040/agent-api/pair — AGENT_PLATFORM_URL
    # in .env.example) and in production (through this proxy).
    location /agent-api/ {
      set $agentBridge http://agent-bridge:4040;
      proxy_pass $agentBridge;
      proxy_http_version 1.1;

      proxy_set_header Host $http_host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $fwd_proto;

      # /check-in holds the response open up to AGENT_CHECK_IN_HOLD_MS
      # (default 25s) — comfortably under this timeout.
      proxy_read_timeout 60s;
      proxy_send_timeout 60s;
    }

    # Nia Core Agent installer downloads — static files served directly by
    # nginx, never proxied to niacore-web. apps/web only ever needs to know
    # the base address (the AGENT_DOWNLOADS_BASE_URL env var it reads at
    # request time, apps/web/src/lib/downloads/manifest.ts); it fetches
    # manifest.json from here at runtime and links each package here too.
    # See DEPLOYMENT.md "Agent downloads" for exactly which files a release
    # must copy into the directory below.
    location /downloads/agent/ {
      alias /usr/share/nginx/agent-downloads/;
      autoindex off;
    }
  }
}
