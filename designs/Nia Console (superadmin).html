document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

366F1;\n--primary:#4F46E5;--primary-hover:#4338CA;--primary-soft:#EEF2FF;\n--live:#4F46E5;--live-dim:#EEF2FF;--live-fill:#4F46E5;--onacc:#FFFFFF;\n--ok:#10B981;--success:#10B981;--success-deep:#047857;\n--warn:#F59E0B;--warning:#F59E0B;--warning-deep:#B45309;--warn-bg:rgba(245,158,11,.14);--warn-bd:rgba(245,158,11,.5);\n--bad:#EF4444;--fail:#EF4444;--error:#EF4444;--error-deep:#B91C1C;--bad-bd:rgba(239,68,68,.28);--bad-bg:rgba(239,68,68,.12);\n--info:#0EA5E9;--c-action:#2563EB;--c-condition:#7C3AED;--c-data:#0891B2;--c-ai:#6366F1;\n--font-display:'Satoshi',system-ui,sans-serif;--font-ui:'Satoshi',system-ui,sans-serif;--font-data:'Satoshi',system-ui,sans-serif;\n--shadow:0 20px 48px rgba(15,23,42,.12);--drop:0 10px 26px -8px rgba(15,23,42,.18);--amb:0 1px 2px rgba(15,23,42,.04);\n}\nhtml,body{margin:0;background:var(--bg);color:var(--text);font-family:'Satoshi',system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased;letter-spacing:-.005em;font-variant-numeric:tabular-nums}\nbutton:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--primary) !important;outline-offset:2px}\na{color:var(--acc);text-decoration:none}a:hover{color:var(--ink)}\nbutton{font-family:inherit;font-size:inherit;letter-spacing:inherit}\ninput,select,textarea{font-family:inherit;letter-spacing:inherit}\ninput::placeholder,textarea::placeholder{color:var(--ink3)}\nbutton:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--live);outline-offset:2px}\n@keyframes fade{from{opacity:0}to{opacity:1}}\n@keyframes riseIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}\n@keyframes toastIn{from{opacity:0;transform:translateX(-50%) translateY(8px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}\n@keyframes barIn{from{transform:scaleY(0);opacity:0}to{transform:scaleY(1);opacity:1}}\n@media (prefers-reduced-motion:reduce){*{animation:none !important}}\n::-webkit-scrollbar{width:8px;height:8px}::-webkit-scrollbar-thumb{background:var(--line2);border-radius:6px}\n<\u002Fstyle>\n<\u002Fhelmet>\n\n<div style=\"width:100%;height:100vh;min-height:720px;box-sizing:border-box;display:flex;flex-direction:column;background:var(--page);color:var(--ink);overflow:hidden;position:relative\">\n\n  <sc-if value=\"{{ isLogin }}\" hint-placeholder-val=\"{{ false }}\">\n  <div style=\"flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:40px;animation:fade .2s ease-out\">\n    <div style=\"width:392px;max-width:100%;display:flex;flex-direction:column;gap:26px\">\n      <div style=\"display:flex;align-items:center;gap:10px\">\n        <span style=\"width:28px;height:28px;flex:none;display:flex;align-items:center;justify-content:center;border-radius:9px;background:linear-gradient(145deg,#6366F1,#4338CA);color:#FFFFFF;font-size:14px;font-weight:700\">N<\u002Fspan>\n        <span style=\"font-family:var(--font-display);font-size:16px;font-weight:700;letter-spacing:-.02em\">Nia Console<\u002Fspan>\n        <span style=\"margin-left:2px;box-sizing:border-box;display:inline-flex;align-items:center;padding:4px 10px;border-radius:7px;font-size:10.5px;font-weight:700;letter-spacing:.14em;color:var(--warning-deep);background:rgba(245,158,11,.06);border:1px dashed rgba(245,158,11,.65)\">INTERNAL<\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;gap:9px\">\n        <span style=\"font-size:27px;font-weight:700;letter-spacing:-.02em;line-height:1.1;color:var(--text)\">Staff sign-in<\u002Fspan>\n        <span style=\"font-size:13px;line-height:1.6;color:var(--ink3)\">Restricted to Nia staff accounts. Every session in this console is recorded in the audit log.<\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;gap:12px\">\n        <input value=\"{{ email }}\" sc-camel-on-change=\"{{ onEmail }}\" placeholder=\"you@nia.com\" spellcheck=\"false\" style=\"{{ loginInputStyle }}\">\n        <input value=\"{{ code }}\" sc-camel-on-change=\"{{ onCode }}\" placeholder=\"2FA code\" spellcheck=\"false\" style=\"{{ codeInputStyle }}\">\n        <sc-if value=\"{{ loginError }}\" hint-placeholder-val=\"{{ false }}\">\n          <span style=\"font-size:12px;color:var(--fail)\">{{ loginErrorText }}<\u002Fspan>\n        <\u002Fsc-if>\n        <button sc-camel-on-click=\"{{ signIn }}\" style=\"{{ signInStyle }}\">Sign in<\u002Fbutton>\n      <\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;gap:10px;padding-top:2px\">\n        <button sc-camel-on-click=\"{{ demoSignIn }}\" style=\"{{ demoStyle }}\">Demo · sign in as Nia staff<\u002Fbutton>\n        <span style=\"font-size:11.5px;line-height:1.6;color:var(--ink4)\">Customer accounts cannot sign in here. There is no account creation and no single sign-on.<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ inApp }}\" hint-placeholder-val=\"{{ true }}\">\n  <div style=\"flex:1;min-height:0;display:flex;flex-direction:column\">\n\n    <div style=\"flex:none;height:52px;box-sizing:border-box;padding:0 16px;display:flex;align-items:center;gap:14px;background:var(--surface);border-bottom:1px solid var(--line2)\">\n      <span style=\"width:24px;height:24px;flex:none;display:flex;align-items:center;justify-content:center;border-radius:8px;background:linear-gradient(145deg,#6366F1,#4338CA);color:#FFFFFF;font-size:13px;font-weight:700\">N<\u002Fspan>\n      <span style=\"font-family:var(--font-display);font-size:14px;font-weight:700;letter-spacing:-.02em\">Nia Console<\u002Fspan>\n      <span style=\"box-sizing:border-box;display:inline-flex;align-items:center;padding:4px 10px;border-radius:7px;font-size:10.5px;font-weight:700;letter-spacing:.14em;color:var(--warning-deep);background:rgba(245,158,11,.06);border:1px dashed rgba(245,158,11,.65)\">INTERNAL<\u002Fspan>\n      <span style=\"flex:1\"><\u002Fspan>\n er:1.5px solid var(--primary);color:#FFFFFF'\n          : 'background:var(--surface);border:1.5px solid var(--line-strong);color:transparent'),\n        toggleSel:(e)=>{ e.stopPropagation(); this.setState(st=>({invSel:Object.assign({}, st.invSel, {[key]: !st.invSel[key]})})); },\n        download:(e)=>{ e.stopPropagation(); this.toast('Invoice for '+i.account+' downloaded'); }\n      };\n    });\n\n    // ---------- support ----------\n    v.tickets = TICKETS.map(t=>{\n      const row = {\n        id:t.id, org:t.org, subject:t.subject, age:t.age, state:t.state, assignee:t.assignee,\n        stateStyle:this.pill(t.state==='Open'?'warn':t.state==='Resolved'?'ok':'neutral'),\n        menuBtnStyle:this.menuBtn(), menuOpen: s.rowMenu==='tic:'+t.id,\n        toggleMenu:(e)=>{ e.stopPropagation(); this.toggleRow('tic:'+t.id); },\n        view:(e)=>{ e.stopPropagation(); openView(t.org, 'Ticket '+t.id); },\n        act:(e)=>{ e.stopPropagation(); this.setState({act:{org:t.org, ticket:t.id}, actReason:'', actMinutes:60, rowMenu:null}); }\n      };\n      row.menuItems = [\n        {label:'View as (read-only)', act:row.view, style:this.menuItem(false)},\n        {label:'Act as — reason required', act:row.act, style:'width:100%;display:block;padding:8px 10px;font-size:12.5px;text-align:left;background:transparent;border:none;border-radius:7px;cursor:pointer;color:var(--warn)'}\n      ];\n      return row;\n    });\n    v.custProjects = CUST_PROJECTS;\n    v.custConns = CUST_CONNS.map(c=>({\n      handle:c.handle, secret:'•••••••••••',\n      dotStyle:'width:6px;height:6px;flex:none;border-radius:50%;background:'+(c.st==='ok'?'var(--ok)':'var(--bad)')\n    }));\n    v.custInvoices = CUST_INVOICES;\n\n    // ---------- act-as modal ----------\n    const act = s.act;\n    v.actOpen = !!act; v.actOrg = act ? act.org : '';\n    v.actReason = s.actReason;\n    v.onActReason = (e)=>{ const val=e.target.value; this.setState({actReason:val}); };\n    v.durations = [30,60,120].map(m=>({\n      label:m+' min',\n      style:'flex:1;height:32px;box-sizing:border-box;border-radius:9px;font-size:12.5px;cursor:pointer;background:'+(s.actMinutes===m?'var(--warn-bg)':'transparent')+';border:1px solid '+(s.actMinutes===m?'var(--warn-bd)':'var(--line2)')+';color:'+(s.actMinutes===m?'var(--warn)':'var(--ink2)'),\n      pick:(e)=>{ e.stopPropagation(); this.setState({actMinutes:m}); }\n    }));\n    v.closeAct = (e)=>{ e.stopPropagation(); this.setState({act:null}); };\n    v.startActStyle = s.actReason.trim()\n      ? 'height:32px;box-sizing:border-box;padding:0 13px;font-size:12.5px;font-weight:600;border-radius:9px;border:none;background:var(--warn);color:#1A1408;cursor:pointer'\n      : 'height:32px;box-sizing:border-box;padding:0 13px;font-size:12.5px;font-weight:600;border-radius:9px;border:1px solid var(--line);background:transparent;color:var(--ink4);cursor:not-allowed';\n    v.startAct = (e)=>{ e.stopPropagation();\n      if(!act || !s.actReason.trim()) return;\n      const reason = s.actReason.trim();\n      this.setState({session:{org:act.org, mode:'act', minutes:s.actMinutes, reason}, elapsed:2, act:null, page:'custview'});\n      this.log(act.org, 'Started act-as session ('+s.actMinutes+' min)', reason);\n      this.toast(act.org+'’s owners notified · session started'); };\n\n    // ---------- action modal (reason + type-to-confirm) ----------\n    const a = s.action;\n    const needsType = !!(a && a.type);\n    const target = a ? (a.second || a.name) : '';\n    const typedOk = !needsType || (!!a && s.actionTyped.trim().toLowerCase()===target.toLowerCase());\n    const reasonOk = s.actionReason.trim().length>3;\n    v.actionOpen = !!a;\n    v.actionTitle = a ? a.title : '';\n    v.actionBody = a ? a.body : '';\n    v.actionCta = a ? a.cta : '';\n    v.actionNeedsType = needsType;\n    v.actionHasChoice = !!(a && a.choices);\n    v.actionChoices = a && a.choices ? a.choices : [];\n    v.actionChoice = s.actionChoice;\n    v.onActionChoice = (e)=>{ const val=e.target.value; this.setState({actionChoice:val}); };\n    v.actionReason = s.actionReason;\n    v.onActionReason = (e)=>{ const val=e.target.value; this.setState({actionReason:val}); };\n    v.actionTyped = s.actionTyped;\n    v.onActionTyped = (e)=>{ const val=e.target.value; this.setState({actionTyped:val}); };\n    v.actionConfirmHint = a ? 'Type '+target+' to confirm' : '';\n    const modalInput = (bd)=>'width:100%;box-sizing:border-box;padding:10px 12px;font-size:12.5px;color:var(--ink);background:var(--surface2);border:1px solid '+bd+';border-radius:10px;outline:none';\n    v.modalInputStyle = modalInput(reasonOk?'var(--line2)':'var(--line)');\n    v.modalConfirmStyle = 'font-family:var(--font-data);'+modalInput(typedOk && needsType?'var(--live)':'var(--line)');\n    v.modalSelectStyle = 'width:100%;box-sizing:border-box;height:38px;padding:0 11px;font-size:12.5px;color:var(--ink2);background:var(--surface2);border:1px solid var(--line);border-radius:10px;outline:none;cursor:pointer';\n    v.modalCancelStyle = 'height:32px;box-sizing:border-box;padding:0 13px;font-size:12px;color:var(--ink3);background:transparent;border:none;border-radius:9px;cursor:pointer';\n    v.actionBtnStyle = (typedOk && reasonOk)\n      ? 'height:32px;box-sizing:border-box;padding:0 13px;font-size:12.5px;font-weight:600;border-radius:9px;border:none;background:var(--live-fill);color:var(--onacc);cursor:pointer'\n      : 'height:32px;box-sizing:border-box;padding:0 13px;font-size:12.5px;font-weight:600;border-radius:9px;border:1px solid var(--line);background:transparent;color:var(--ink4);cursor:not-allowed';\n    v.closeAction = (e)=>{ e.stopPropagation(); this.setState({action:null, actionReason:'', actionTyped:''}); };\n    v.runAction = (e)=>{ e.stopPropagation();\n      if(!a || !typedOk || !reasonOk) return;\n      const reason = s.actionReason.trim();\n      const detail = a.choices ? a.action+' · '+s.actionChoice : a.action;\n      if(a.run) a.run();\n      this.setState({action:null, actionReason:'', actionTyped:''});\n      this.log(a.org, detail, reason);\n      this.toast(detail+' · '+a.org); };\n\n    // ---------- settings ----------\n    v.setTabs = [{id:'team', label:'Team'},{id:'flags', label:'Feature flags'},{id:'catalog', label:'Connector catalog'},{id:'audit', label:'Audit log'}].map(t=>({\n      label:t.label,\n      style:'height:34px;box-sizing:border-box;padding:0 2px;margin-right:18px;font-family:inherit;font-size:13.5px;font-weight:'+(s.setTab===t.id?700:500)+';background:transparent;border:none;border-bottom:2px solid '+(s.setTab===t.id?'var(--primary)':'transparent')+';color:'+(s.setTab===t.id?'var(--primary)':'var(--secondary)')+';cursor:pointer',\n      go:(e)=>{ e.stopPropagation(); this.setState({setTab:t.id, rowMenu:null}); }\n    }));\n    v.setTeam = s.setTab==='team'; v.setFlags = s.setTab==='flags';\n    v.setCatalog = s.setTab==='catalog'; v.setAudit = s.setTab==='audit';\n    v.team = TEAM.map(t=>Object.assign({}, t, {avatarStyle:this.avatar()}));\n    v.inviteStaff = (e)=>{ e.stopPropagation(); this.toast('Staff invites are issued from the identity provider'); };\n    v.flags = [\n      {id:'flag-ai', name:'Copilot mapping suggestions', desc:'Proposes field mappings from schema samples.', rollout:'100%'},\n      {id:'flag-mcp', name:'MCP servers', desc:'Lets orgs register their own MCP tool servers.', rollout:'internal'},\n      {id:'flag-vector', name:'Vector connectors', desc:'pgvector and Chroma in the connector catalog.', rollout:'100%'},\n      {id:'flag-sso', name:'SSO for Organization plans', desc:'SAML sign-in for org accounts.', rollout:'org plan'},\n      {id:'flag-usage', name:'Usage-based pricing preview', desc:'Row-based metering shown next to seat pricing.', rollout:'5%'}\n    ].map(fl=>{\n      const on = !!s.flags[fl.id];\n      return {\n        name:fl.name, desc:fl.desc, rollout:fl.rollout,\n        switchStyle:'flex:none;width:34px;height:20px;box-sizing:border-box;display:flex;align-items:center;padding:2px;border-radius:10px;cursor:pointer;background:'+(on?'var(--live-fill)':'var(--surface2)')+';border:1px solid '+(on?'var(--live)':'var(--line2)'),\n        knobStyle:'width:14px;height:14px;border-radius:50%;background:'+(on?'var(--onacc)':'var(--ink4)')+';transform:translateX('+(on?14:0)+'px);transition:transform .16s ease',\n        toggle:(e)=>{ e.stopPropagation();\n          this.setState(st=>({flags:{...st.flags,[fl.id]:!on}}));\n          this.log('Platform', (on?'Disabled':'Enabled')+' flag '+fl.name, 'Feature flag change'); }\n      };\n    });\n    v.connectors = CONNECTORS.map((c,i)=>{\n      const state = s.catalog[i];\n      const row = {\n        name:c.name, category:c.category, version:c.version, state, orgs:String(c.orgs), rate:c.rate,\n        mono:c.mono, monoStyle:this.mono(),\n        stateStyle:this.pill(state==='Published'?'ok':state==='Beta'?'warn':'bad'),\n        menuBtnStyle:this.menuBtn(), menuOpen: s.rowMenu==='con:'+c.id,\n        toggleMenu:(e)=>{ e.stopPropagation(); this.toggleRow('con:'+c.id); },\n        publish:(e)=>{ e.stopPropagation();\n          const next = state==='Published' ? 'Beta' : 'Published';\n          this.setState(st=>({catalog:st.catalog.map((x,j)=>j===i?next:x), rowMenu:null}));\n          this.log(c.name+' connector', next==='Published' ? 'Published connector' : 'Unpublished connector', 'Catalog change');\n          this.toast(c.name+' is now '+next.toLowerCase()); },\n        version_:(e)=>{ e.stopPropagation();\n          this.setState({rowMenu:null});\n          this.log(c.name+' connector', 'Released new version', 'Catalog change');\n          this.toast(c.name+' version bumped — customers see it on next load'); },\n        deprecate:(e)=>{ e.stopPropagation(); this.openAction({\n          title:'Deprecate '+c.name+'?', cta:'Deprecate connector', name:c.name, type:true,\n          body: c.orgs+' organizations use '+c.name+' today. Existing connections keep running, but the connector disappears from Available and no new connections can be made.',\n          org:c.name+' connector', action:'Deprecated connector',\n          run:()=>this.setState(st=>({catalog:st.catalog.map((x,j)=>j===i?'Deprecated':x)}))}); }\n      };\n      row.menuItems = [\n        {label: state==='Published' ? 'Unpublish (back to beta)' : 'Publish to catalog', act:row.publish, style:this.menuItem(false)},\n        {label:'Release new version', act:row.version_, style:this.menuItem(false)},\n        {label:'Deprecate connector', act:row.deprecate, style:this.menuItem(true)}\n      ];\n      return row;\n    });\n\n    // ---------- audit ----------\n    v.auditQ = s.auditQ; v.onAuditQ = (e)=>{ const val=e.target.value; this.setState({auditQ:val}); };\n    v.auditKind = s.auditKind; v.auditKinds = ['All actions','Access sessions','Suspensions','Deletions','Catalog and flags','Notifications'];\n    v.onAuditKind = (e)=>{ const val=e.target.value; this.setState({auditKind:val}); };\n    v.exportAudit = (e)=>{ e.stopPropagation(); this.toast('Audit export queued — CSV emailed to dana@nia.com'); };\n    const aq = s.auditQ.trim().toLowerCase();\n    const matchKind = (row)=>{\n      if(s.auditKind==='All actions') return true;\n      const act2 = row.action.toLowerCase();\n      if(s.auditKind==='Access sessions') return act2.indexOf('session')>=0 || act2.indexOf('viewed as')>=0;\n      if(s.auditKind==='Suspensions') return act2.indexOf('suspend')>=0 || act2.indexOf('restor')>=0;\n      if(s.auditKind==='Deletions') return act2.indexOf('delet')>=0 || act2.indexOf('purge')>=0;\n      if(s.auditKind==='Notifications') return act2.indexOf('notification')>=0;\n      return act2.indexOf('connector')>=0 || act2.indexOf('flag')>=0 || act2.indexOf('plan')>=0 || act2.indexOf('limit')>=0;\n    };\n    const all = s.entries.concat(SEED_AUDIT);\n    v.auditRows = all.filter(matchKind).filter(r=>!aq || (r.actor+' '+r.org+' '+r.action+' '+r.reason).toLowerCase().indexOf(aq)>=0);\n    v
