services:
  niacore-api:
    image: ${API_IMAGE_VERSION}
    container_name: niacore-api
    restart: unless-stopped

    env_file:
      - .env

    environment:
      - NODE_ENV=${NODE_ENV}
      - PORT=4001
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL}
      - BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET}
      - API_URL=${API_URL}
      - WEB_ORIGIN=${WEB_ORIGIN}
      - NIA_SECRET_MASTER_KEY=${NIA_SECRET_MASTER_KEY}
      - NIA_GATEWAY_API_KEY=${NIA_GATEWAY_API_KEY}
      - NIA_GATEWAY_BASE_URL=${NIA_GATEWAY_BASE_URL}
      - NIA_GATEWAY_MODEL=${NIA_GATEWAY_MODEL}

    ports:
      - "${API_PORT:-4001}:4001"

    networks:
      - niacore-network

    depends_on:
      - niacore-redis

    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  niacore-worker:
    image: ${WORKER_IMAGE_VERSION}
    container_name: niacore-worker
    restart: unless-stopped

    env_file:
      - .env

    environment:
      - NODE_ENV=production
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL}
      - NIA_SECRET_MASTER_KEY=${NIA_SECRET_MASTER_KEY}
      - WRITE_DISPATCH_SIGNING_SECRET=${WRITE_DISPATCH_SIGNING_SECRET}
      - NIA_GATEWAY_API_KEY=${NIA_GATEWAY_API_KEY}

    networks:
      - niacore-network

    depends_on:
      - niacore-redis

  niacore-connector-mysql:
    image: ${CONNECTOR_MYSQL_IMAGE_VERSION}
    container_name: niacore-connector-mysql
    restart: unless-stopped

    env_file:
      - .env

    environment:
      - PORT=4010
      - NIA_SECRET_MASTER_KEY=${NIA_SECRET_MASTER_KEY}
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      - WRITE_DISPATCH_SIGNING_SECRET=${WRITE_DISPATCH_SIGNING_SECRET}

    # alias "connector-mysql" is a hard contract, not cosmetic: the worker/
    # api dial connector host:port by the literal hostname hardcoded in
    # packages/schemas/src/connectors/mysql.ts's service.host — that value
    # never changes at deploy time (CONNECTOR_DEV_HOST is refused in prod,
    # see apps/worker/src/env.ts's .refine()). Renaming this service without
    # keeping the alias breaks connector dispatch + freshness checks with
    # DNS resolution failures, regardless of the container_name above.
    networks:
      niacore-network:
        aliases:
          - connector-mysql

    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4010/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  niacore-connector-mongodb:
    image: ${CONNECTOR_MONGODB_IMAGE_VERSION}
    container_name: niacore-connector-mongodb
    restart: unless-stopped

    env_file:
      - .env

    environment:
      - PORT=4020
      - NIA_SECRET_MASTER_KEY=${NIA_SECRET_MASTER_KEY}
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      - WRITE_DISPATCH_SIGNING_SECRET=${WRITE_DISPATCH_SIGNING_SECRET}

    # alias contract — see niacore-connector-mysql's comment above.
    networks:
      niacore-network:
        aliases:
          - connector-mongodb

    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4020/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  niacore-connector-supabase:
    image: ${CONNECTOR_SUPABASE_IMAGE_VERSION}
    container_name: niacore-connector-supabase
    restart: unless-stopped

    env_file:
      - .env

    environment:
      - PORT=4030
      - NIA_SECRET_MASTER_KEY=${NIA_SECRET_MASTER_KEY}
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      - WRITE_DISPATCH_SIGNING_SECRET=${WRITE_DISPATCH_SIGNING_SECRET}

    # alias contract — see niacore-connector-mysql's comment above.
    networks:
      niacore-network:
        aliases:
          - connector-supabase

    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4030/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  niacore-redis:
    image: redis:7-alpine
    container_name: niacore-redis
    restart: unless-stopped

    command: >
      redis-server
      --appendonly yes
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --timeout 0
      --tcp-keepalive 60

    volumes:
      - niacore_redis_data:/data

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

    networks:
      - niacore-network

volumes:
  niacore_redis_data:

networks:
  niacore-network:
    driver: bridge
    enable_ipv6: true
    ipam:
      driver: default
      config:
        - subnet: 172.29.0.0/16
        - subnet: "2001:db8:3::/64"
