# Nia Core — production stack. One image per service, all built from the monorepo.
# Required variables use ${VAR:?...}: if one is missing, `docker compose` stops
# with a clear error instead of starting containers with blank values.
# The database is managed Postgres (currently hosted on Supabase, used as plain
# Postgres with no Supabase features), reached via DATABASE_URL. There is no DB container.

services:
  niacore-api:
    image: ${API_IMAGE_VERSION:?API_IMAGE_VERSION is not set in .env}
    container_name: niacore-api
    restart: unless-stopped

    env_file:
      - .env

    environment:
      - PORT=4001
      - NODE_ENV=production
      - DATABASE_URL=${DATABASE_URL:?DATABASE_URL is not set in .env}
      - REDIS_URL=${REDIS_URL:?REDIS_URL is not set in .env}
      - BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET:?BETTER_AUTH_SECRET is not set in .env}
      - API_URL=${API_URL:?API_URL is not set in .env}
      - WEB_ORIGIN=${WEB_ORIGIN:?WEB_ORIGIN is not set in .env}
      - NIA_SECRET_MASTER_KEY=${NIA_SECRET_MASTER_KEY:?NIA_SECRET_MASTER_KEY is not set in .env}
      - NIA_GATEWAY_API_KEY=${NIA_GATEWAY_API_KEY:?NIA_GATEWAY_API_KEY is not set in .env}
      - NIA_GATEWAY_BASE_URL=${NIA_GATEWAY_BASE_URL:?NIA_GATEWAY_BASE_URL is not set in .env}
      - NIA_GATEWAY_MODEL=${NIA_GATEWAY_MODEL:?NIA_GATEWAY_MODEL is not set in .env}
      - WRITE_DISPATCH_SIGNING_SECRET=${WRITE_DISPATCH_SIGNING_SECRET:?WRITE_DISPATCH_SIGNING_SECRET is not set in .env}

    # No public port. Only niacore-proxy is public. The api runs database
    # migrations at container start, then serves.
    networks:
      - niacore-network

    depends_on:
      niacore-redis:
        condition: service_healthy

    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      # Longer start period: migrations run before the server starts.
      start_period: 60s

  niacore-web:
    image: ${WEB_IMAGE_VERSION:?WEB_IMAGE_VERSION is not set in .env}
    container_name: niacore-web
    restart: unless-stopped

    env_file:
      - .env

    environment:
      - PORT=3000
      - NODE_ENV=production
      - DATABASE_URL=${DATABASE_URL:?DATABASE_URL is not set in .env}
      - BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET:?BETTER_AUTH_SECRET is not set in .env}
      - SITE_URL=${WEB_ORIGIN:?WEB_ORIGIN is not set in .env}
      # Fixed Docker-network address (same contract as the connector aliases).
      - API_INTERNAL_URL=http://niacore-api:4001

    networks:
      - niacore-network

    depends_on:
      niacore-api:
        condition: service_healthy

    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health-web').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  niacore-proxy:
    image: nginx:alpine
    container_name: niacore-proxy
    restart: unless-stopped

    # Public front door. Routes everything to niacore-web:3000; web reaches
    # the api itself via its /api/backend rewrite. TLS terminates in front
    # (load balancer) and must forward Host and X-Forwarded-Proto: https.
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro

    ports:
      - "${PROXY_PORT:-80}:80"

    networks:
      - niacore-network

    depends_on:
      niacore-web:
        condition: service_healthy

  niacore-worker:
    image: ${WORKER_IMAGE_VERSION:?WORKER_IMAGE_VERSION is not set in .env}
    container_name: niacore-worker
    restart: unless-stopped

    env_file:
      - .env

    environment:
      - NODE_ENV=production
      - DATABASE_URL=${DATABASE_URL:?DATABASE_URL is not set in .env}
      - REDIS_URL=${REDIS_URL:?REDIS_URL is not set in .env}
      - NIA_SECRET_MASTER_KEY=${NIA_SECRET_MASTER_KEY:?NIA_SECRET_MASTER_KEY is not set in .env}
      - WRITE_DISPATCH_SIGNING_SECRET=${WRITE_DISPATCH_SIGNING_SECRET:?WRITE_DISPATCH_SIGNING_SECRET is not set in .env}
      - NIA_GATEWAY_API_KEY=${NIA_GATEWAY_API_KEY:?NIA_GATEWAY_API_KEY is not set in .env}

    networks:
      - niacore-network

    # Waits for the api to be healthy, so migrations have finished before
    # the worker touches the database.
    depends_on:
      niacore-redis:
        condition: service_healthy
      niacore-api:
        condition: service_healthy

  niacore-connector-mysql:
    image: ${CONNECTOR_MYSQL_IMAGE_VERSION:?CONNECTOR_MYSQL_IMAGE_VERSION is not set in .env}
    container_name: niacore-connector-mysql
    restart: unless-stopped

    env_file:
      - .env

    environment:
      - PORT=4010
      - NODE_ENV=production
      - NIA_SECRET_MASTER_KEY=${NIA_SECRET_MASTER_KEY:?NIA_SECRET_MASTER_KEY is not set in .env}
      - DATABASE_URL=${DATABASE_URL:?DATABASE_URL is not set in .env}
      - WRITE_DISPATCH_SIGNING_SECRET=${WRITE_DISPATCH_SIGNING_SECRET:?WRITE_DISPATCH_SIGNING_SECRET is not set in .env}

    # The alias is a hard contract: api/worker dial "connector-mysql" by the
    # hostname in packages/schemas/src/connectors/mysql.ts. Never remove it.
    networks:
      niacore-network:
        aliases:
          - connector-mysql

    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4010/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  niacore-connector-mongodb:
    image: ${CONNECTOR_MONGODB_IMAGE_VERSION:?CONNECTOR_MONGODB_IMAGE_VERSION is not set in .env}
    container_name: niacore-connector-mongodb
    restart: unless-stopped

    env_file:
      - .env

    environment:
      - PORT=4020
      - NODE_ENV=production
      - NIA_SECRET_MASTER_KEY=${NIA_SECRET_MASTER_KEY:?NIA_SECRET_MASTER_KEY is not set in .env}
      - DATABASE_URL=${DATABASE_URL:?DATABASE_URL is not set in .env}
      - WRITE_DISPATCH_SIGNING_SECRET=${WRITE_DISPATCH_SIGNING_SECRET:?WRITE_DISPATCH_SIGNING_SECRET is not set in .env}

    # Alias contract, see niacore-connector-mysql.
    networks:
      niacore-network:
        aliases:
          - connector-mongodb

    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4020/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  niacore-connector-supabase:
    image: ${CONNECTOR_SUPABASE_IMAGE_VERSION:?CONNECTOR_SUPABASE_IMAGE_VERSION is not set in .env}
    container_name: niacore-connector-supabase
    restart: unless-stopped

    env_file:
      - .env

    environment:
      - PORT=4030
      - NODE_ENV=production
      - NIA_SECRET_MASTER_KEY=${NIA_SECRET_MASTER_KEY:?NIA_SECRET_MASTER_KEY is not set in .env}
      - DATABASE_URL=${DATABASE_URL:?DATABASE_URL is not set in .env}
      - WRITE_DISPATCH_SIGNING_SECRET=${WRITE_DISPATCH_SIGNING_SECRET:?WRITE_DISPATCH_SIGNING_SECRET is not set in .env}

    # Alias contract, see niacore-connector-mysql. Serves Postgres and Supabase.
    networks:
      niacore-network:
        aliases:
          - connector-supabase

    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4030/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  niacore-redis:
    image: redis:7-alpine
    container_name: niacore-redis
    restart: unless-stopped

    # noeviction: BullMQ keeps jobs in Redis. Eviction would silently drop jobs.
    command: >
      redis-server
      --appendonly yes
      --maxmemory 256mb
      --maxmemory-policy noeviction
      --timeout 0
      --tcp-keepalive 60

    volumes:
      - niacore_redis_data:/data

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

    networks:
      - niacore-network

volumes:
  niacore_redis_data:

networks:
  niacore-network:
    driver: bridge
    enable_ipv6: true
    ipam:
      driver: default
      config:
        - subnet: 172.29.0.0/16
        - subnet: "2001:db8:3::/64"