x-niacore: &niacore
  restart: unless-stopped
  env_file: .env
  networks:
    - niacore-dev

services:
  niacore-postgres:
    image: ${POSTGRES_IMAGE_VERSION:?set POSTGRES_IMAGE_VERSION in .env}
    container_name: niacore-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: niacore
    volumes:
      - niacore-pgdata17:/var/lib/postgresql/data
    networks:
      - niacore-dev
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d niacore"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s

  niacore-redis:
    image: redis:7-alpine
    container_name: niacore-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy noeviction --timeout 0 --tcp-keepalive 60
    volumes:
      - niacore-redisdata:/data
    networks:
      - niacore-dev
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  niacore-api:
    <<: *niacore
    image: ${API_IMAGE_VERSION:?set API_IMAGE_VERSION in .env}
    container_name: niacore-api
    environment:
      - NODE_ENV=production
      - NODE_OPTIONS=--dns-result-order=ipv4first
      - PORT=4001
      - PAYMENTS_ENABLED=${PAYMENTS_ENABLED:-false}
    depends_on:
      niacore-postgres:
        condition: service_healthy
      niacore-redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

  niacore-worker:
    <<: *niacore
    image: ${WORKER_IMAGE_VERSION:?set WORKER_IMAGE_VERSION in .env}
    container_name: niacore-worker
    stop_grace_period: 60s
    environment:
      - NODE_ENV=production
      - NODE_OPTIONS=--dns-result-order=ipv4first
    depends_on:
      niacore-redis:
        condition: service_healthy
      niacore-api:
        condition: service_healthy

  niacore-web:
    <<: *niacore
    image: ${WEB_IMAGE_VERSION:?set WEB_IMAGE_VERSION in .env}
    container_name: niacore-web
    environment:
      - NODE_ENV=production
      - NODE_OPTIONS=--dns-result-order=ipv4first
      - PORT=3000
      - SITE_URL=${WEB_ORIGIN:?set WEB_ORIGIN in .env}
      - API_INTERNAL_URL=http://niacore-api:4001
    ports:
      - "127.0.0.1:${WEB_HOST_PORT:-3000}:3000"
    depends_on:
      niacore-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health-web').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  niacore-agent-bridge:
    <<: *niacore
    image: ${AGENT_BRIDGE_IMAGE_VERSION:?set AGENT_BRIDGE_IMAGE_VERSION in .env}
    container_name: niacore-agent-bridge
    environment:
      - NODE_ENV=production
      - NODE_OPTIONS=--dns-result-order=ipv4first
      - PORT=4040
      - INTERNAL_PORT=4041
    ports:
      - "127.0.0.1:${BRIDGE_HOST_PORT:-4040}:4040"
    networks:
      niacore-dev:
        aliases:
          - agent-bridge
    depends_on:
      niacore-postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4040/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  niacore-connector-mysql:
    <<: *niacore
    image: ${CONNECTOR_MYSQL_IMAGE_VERSION:?set CONNECTOR_MYSQL_IMAGE_VERSION in .env}
    container_name: niacore-connector-mysql
    environment:
      - NODE_ENV=production
      - NODE_OPTIONS=--dns-result-order=ipv4first
      - PORT=4010
    networks:
      niacore-dev:
        aliases:
          - connector-mysql
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4010/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  niacore-connector-mongodb:
    <<: *niacore
    image: ${CONNECTOR_MONGODB_IMAGE_VERSION:?set CONNECTOR_MONGODB_IMAGE_VERSION in .env}
    container_name: niacore-connector-mongodb
    environment:
      - NODE_ENV=production
      - NODE_OPTIONS=--dns-result-order=ipv4first
      - PORT=4020
    networks:
      niacore-dev:
        aliases:
          - connector-mongodb
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4020/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  niacore-connector-supabase:
    <<: *niacore
    image: ${CONNECTOR_SUPABASE_IMAGE_VERSION:?set CONNECTOR_SUPABASE_IMAGE_VERSION in .env}
    container_name: niacore-connector-supabase
    environment:
      - NODE_ENV=production
      - NODE_OPTIONS=--dns-result-order=ipv4first
      - PORT=4030
    networks:
      niacore-dev:
        aliases:
          - connector-supabase
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4030/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  niacore-pgdata17:
  niacore-redisdata:

networks:
  niacore-dev:
    driver: bridge
    enable_ipv6: true
    ipam:
      config:
        - subnet: 172.29.0.0/16
        - subnet: "2001:db8:3::/64"